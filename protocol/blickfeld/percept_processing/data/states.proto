syntax = "proto3";

import "blickfeld/base/options.proto";
import "blickfeld/percept_processing/data/state.proto";
package blickfeld.percept_processing.data;

option (.blickfeld.base.access_control_file) = {
  level: LEVEL_AUTHORIZED
};

// A message that contains the processed states: per zone and globally in the scene
// A state is an information generated by the system based on the select zone type or device. For example, a state
// can contain information about the volume or the intrusion in the zone.
message States {
  // A message containing scene-wide states
  message Scene {
    // States of the security scene
    message Security {
      // Indicates if there is an intrusion in the scene
      bool intrusion = 1;
      // Indicates if there is motion in the scene
      bool motion = 2;
      // Indicates if there is tampering due to device movement
      bool moved_tampering = 3;
      // Indicates if there is tampering due to device coverage
      bool covered_tampering = 4;
      // Indicates if device is tampered - either due to movement or coverage
      bool tampering = 5;
    }
    // Global states in the scene (e.g. security, motion, volume...)
    oneof state_type {
      // Global security states
      .blickfeld.percept_processing.data.States.Scene.Security security = 1;
    }
  }
  // The timestamp of the measurement(s) used to compute the states.
  uint64 timestamp = 1 [(.blickfeld.base.unit) = "ns"];
  // Map of states where the key is the generator UUID of the state
  map<string, .blickfeld.percept_processing.data.State> states = 2;
  // Indicates if at least one of the states (global or per zone) was overwritten with event state injected by inject event service
  bool injected = 3;
  // Global states in the scene
  .blickfeld.percept_processing.data.States.Scene scene = 4;
}

