syntax = "proto3";

import "blickfeld/base/options.proto";
import "blickfeld/percept_pipeline/config/data_source.proto";
import "blickfeld/percept_processing/data/camera.proto";
package blickfeld.percept_processing.services;

option (.blickfeld.base.access_control_file) = {
  level: LEVEL_AUTHORIZED
};

// A request to receive a stream of a camera's video.
message CameraStreamRequest {
  // The camera to stream video from, described as the data source describes one.
  //  
  // A camera that is configured is recognised by its `serial_number` and served from the stream
  // the pipeline already receives from it; one that is not needs its connection filled in and is
  // served from a stream opened for this call alone.
  .blickfeld.percept_pipeline.config.DataSource.Camera camera = 1;
}

// One message of a camera's video stream.
message CameraStreamResponse {
  // The format the pictures that follow are encoded in, or one of those pictures.
  .blickfeld.percept_processing.data.Camera.Video video = 1;
}

// Service for what a camera sees, as the other services here serve the pipeline's other output.
//  
// Finding a camera and aiming it are the `percept_pipeline` `Camera` service's.
service Camera {
  option (.blickfeld.base.access_control_service) = {
    level: LEVEL_AUTHORIZED
  };
  option (.blickfeld.base.protocol_maturity_service) = {
    level: LEVEL_EXPERIMENTAL
  };
  // A camera's live video, for as long as the caller keeps the stream open.
  //  
  // The first message carries the format to configure a decoder with; the pictures follow,
  // starting at a keyframe, so something can be shown at once. The format is sent again whenever
  // it changes, and is followed by a keyframe. The encoded video is the camera's own, passed on
  // without being decoded or encoded again; every viewer of a camera shares the one stream the
  // device receives from it.
  rpc Stream(.blickfeld.percept_processing.services.CameraStreamRequest) returns (stream .blickfeld.percept_processing.services.CameraStreamResponse) {
    option (.blickfeld.base.access_control_method) = {
      read_only: true
    };
  }
}

