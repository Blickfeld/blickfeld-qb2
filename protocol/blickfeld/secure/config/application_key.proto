syntax = "proto3";

import "blickfeld/base/options.proto";
package blickfeld.secure.config;

option (.blickfeld.base.access_control_file) = {
  level: LEVEL_AUTHORIZED
};

// An application key is linked to a user account.
message ApplicationKey {
  // Human readable purpose for this application key. It is recommended to briefly describe the purpose of the application key here. The
  // field should help users to quickly identify different application keys but can also be left empty.
  string purpose = 1 [(.blickfeld.base.validate) = {
    string {
      maximum: 200
    }
  }];
  // Access level which is granted to this application key.
  .blickfeld.base.AccessControl.Level access_level = 2 [(.blickfeld.base.access_control_field) = {
    level: LEVEL_ADMIN
  }, (.blickfeld.base.validate) = {
    optional: true
  }];
  // If true, this application key has read-only access permissions.
  bool access_read_only = 7;
  // If true, this key authenticates ONVIF requests and RTSP video streams (HTTP digest, WS-UsernameToken, RTSP basic and digest)
  // and can not be used for a regular login.
  bool access_http = 8;
  // Optional name to authenticate ONVIF and RTSP with in place of the account name, i.e. an ONVIF user. Requires `access_http`.
  // Has to be unique among all account names and application key usernames.
  string username = 10 [(.blickfeld.base.validate) = {
    string {
      pattern: "^[a-zA-Z0-9\\._-]{1,100}$"
    }
    optional: true
  }];
  reserved 4, 6;
}

